<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LINEV X-ray Inspection Form</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --green:#3B6D11;--green-bg:#EAF3DE;
    --amber:#BA7517;--amber-bg:#FAEEDA;
    --red:#A32D2D;--red-bg:#FCEBEB;
    --border:#ddd;--text:#1a1a1a;--sub:#666;
    --bg:#f5f5f0;--card:#fff;--hdr:#1e1e1e;
  }
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:15px;min-height:100vh}
  .top-bar{background:var(--hdr);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:10px}
  .top-bar h1{font-size:15px;font-weight:600;flex:1}
  .top-bar p{font-size:11px;opacity:0.6;margin-top:1px}
  .export-top{background:#fff;color:#1a1a1a;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
  .export-top:active{opacity:0.7}
  .container{max-width:680px;margin:0 auto;padding:16px 12px 40px}
  .card{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:16px;margin-bottom:12px}
  .card h2{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--sub);margin-bottom:12px}
  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .field-grid.full{grid-template-columns:1fr}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;color:var(--sub)}
  .field input{border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:14px;color:var(--text);background:#fff;outline:none;width:100%;-webkit-appearance:none}
  .field input:focus{border-color:#888;box-shadow:0 0 0 3px rgba(0,0,0,0.06)}
  .legend{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:4px}
  .leg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)}
  .dot{width:10px;height:10px;border-radius:50%}
  .prog-wrap{margin-bottom:4px}
  .prog-bar{height:4px;background:#e8e8e0;border-radius:2px;overflow:hidden;margin-top:6px}
  .prog-fill{height:100%;background:var(--green);border-radius:2px;transition:width 0.3s}
  .prog-stats{display:flex;gap:14px;font-size:12px;margin-top:6px}
  .prog-stat{display:flex;align-items:center;gap:5px;font-weight:600}
  .section-title{background:var(--hdr);color:#fff;border-radius:8px;padding:9px 14px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:6px}
  .check-row{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:5px;transition:background 0.15s}
  .check-row.st-ok{background:var(--green-bg);border-color:#c5dba8}
  .check-row.st-warn{background:var(--amber-bg);border-color:#f0d090}
  .check-row.st-crit{background:var(--red-bg);border-color:#f0b0b0}
  .check-label{flex:1;font-size:13px;line-height:1.4}
  .btns{display:flex;gap:5px;flex-shrink:0}
  .sbtn{width:34px;height:34px;border-radius:50%;border:1.5px solid #ccc;background:transparent;cursor:pointer;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:all 0.12s}
  .sbtn:active{transform:scale(0.9)}
  .sbtn.ok{background:var(--green-bg);border-color:var(--green);color:var(--green)}
  .sbtn.warn{background:var(--amber-bg);border-color:var(--amber);color:var(--amber)}
  .sbtn.crit{background:var(--red-bg);border-color:var(--red);color:var(--red)}
  .special-row{display:flex;flex-direction:column;gap:6px;padding:10px 12px;background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:5px;transition:background 0.15s}
  .special-row.st-ok{background:var(--green-bg);border-color:#c5dba8}
  .special-row.st-warn{background:var(--amber-bg);border-color:#f0d090}
  .special-row.st-crit{background:var(--red-bg);border-color:#f0b0b0}
  .special-top{display:flex;align-items:center;gap:8px}
  .val-input{border:1px solid #ccc;border-radius:7px;padding:7px 10px;font-size:13px;width:72px;background:#fff;outline:none;-webkit-appearance:none}
  .val-input:focus{border-color:#888}
  .unit-label{font-size:12px;color:var(--sub);font-weight:600}
  textarea{width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:14px;color:var(--text);background:#fff;resize:vertical;min-height:90px;outline:none;font-family:inherit;-webkit-appearance:none}
  textarea:focus{border-color:#888;box-shadow:0 0 0 3px rgba(0,0,0,0.06)}
  .sig-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .sig-box{display:flex;flex-direction:column;gap:4px}
  .sig-box label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;color:var(--sub)}
  canvas{border:1px solid var(--border);border-radius:8px;background:#fff;width:100%;height:100px;cursor:crosshair;touch-action:none;display:block}
  .clear-btn{font-size:12px;color:var(--sub);background:none;border:none;cursor:pointer;padding:2px 0;text-align:left}
  .export-btn{width:100%;padding:15px;background:var(--hdr);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px;letter-spacing:0.02em}
  .export-btn:active{opacity:0.85;transform:scale(0.99)}
  .badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;margin-left:6px;vertical-align:middle}
  .badge-ok{background:var(--green-bg);color:var(--green)}
  .badge-warn{background:var(--amber-bg);color:var(--amber)}
  .badge-crit{background:var(--red-bg);color:var(--red)}
  @media(max-width:400px){.field-grid{grid-template-columns:1fr}.sig-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top-bar">
  <div style="flex:1">
    <h1>🔍 X-ray Inspection Form</h1>
    <p>LINEV BV100100DV — Apple Scientific</p>
  </div>
  <button class="export-top" onclick="exportPDF()">⬇ PDF</button>
</div>

<div class="container">

  <!-- Info Card -->
  <div class="card">
    <h2>ข้อมูลการตรวจ</h2>
    <div class="field-grid" style="margin-bottom:10px">
      <div class="field">
        <label>S/N (Serial Number)</label>
        <input type="text" id="sn" placeholder="ระบุ S/N">
      </div>
      <div class="field">
        <label>วันที่</label>
        <input type="date" id="date">
      </div>
    </div>
    <div class="field-grid full">
      <div class="field">
        <label>สถานที่ (Location)</label>
        <input type="text" id="location" placeholder="ระบุสถานที่ติดตั้ง">
      </div>
    </div>
  </div>

  <!-- Legend + Progress -->
  <div class="card">
    <div class="legend">
      <div class="leg"><div class="dot" style="background:var(--green)"></div>ปกติ (OK)</div>
      <div class="leg"><div class="dot" style="background:var(--amber)"></div>ควรติดตาม</div>
      <div class="leg"><div class="dot" style="background:var(--red)"></div>ต้องแก้ไขด่วน</div>
    </div>
    <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
    <div class="prog-stats">
      <span class="prog-stat" style="color:var(--sub)" id="pctTxt">0 / 0 รายการ</span>
      <span class="prog-stat" style="color:var(--green)"><span class="dot" style="background:var(--green);width:8px;height:8px;border-radius:50%;display:inline-block"></span><span id="cntOk">0</span></span>
      <span class="prog-stat" style="color:var(--amber)"><span class="dot" style="background:var(--amber);width:8px;height:8px;border-radius:50%;display:inline-block"></span><span id="cntWarn">0</span></span>
      <span class="prog-stat" style="color:var(--red)"><span class="dot" style="background:var(--red);width:8px;height:8px;border-radius:50%;display:inline-block"></span><span id="cntCrit">0</span></span>
    </div>
  </div>

  <!-- Checklist -->
  <div id="checklistArea"></div>

  <!-- Comments -->
  <div class="card">
    <h2>ความคิดเห็น / Comments</h2>
    <textarea id="comments" placeholder="บันทึกข้อสังเกต หรือรายละเอียดเพิ่มเติม..."></textarea>
  </div>

  <!-- Signature -->
  <div class="card">
    <h2>ลายเซ็นรับรอง</h2>
    <div class="sig-grid">
      <div class="sig-box">
        <label>วิศวกรซ่อมบำรุง</label>
        <canvas id="sigEng"></canvas>
        <button class="clear-btn" onclick="clearSig('sigEng')">🗑 ล้างลายเซ็น</button>
      </div>
      <div class="sig-box">
        <label>ผู้ใช้งาน (User)</label>
        <canvas id="sigUser"></canvas>
        <button class="clear-btn" onclick="clearSig('sigUser')">🗑 ล้างลายเซ็น</button>
      </div>
    </div>
  </div>

  <button class="export-btn" onclick="exportPDF()">⬇ Export เป็น PDF</button>

</div>

<script>
const sections=[
  {title:"ก่อนเปิดเครื่อง — First order before turning on",items:[
    {id:"power_cord",label:"สายไฟ (Power Cord)"},
    {id:"ground",label:"วัดความต้านทานสายกราวด์ถึงตัวเครื่อง (Ground resistance)"},
    {id:"fan",label:"ฟิลเตอร์พัดลมระบายความร้อน (Cooling fan filters)"},
    {id:"cables",label:"สายไฟและสายสัญญาณภายใน (Internal cables / wiring for damage)"},
    {id:"belt",label:"ตรวจสอบสายพาน (Inspect belt surface for damage)"},
    {id:"curtains",label:"ม่านตะกั่ว (Curtains)"},
    {id:"interconnect",label:"การเชื่อมต่อและสายต่างๆ (Interconnections and wires, tightness)"},
    {id:"generator",label:"เครื่องกำเนิดรังสี (Generator for oil leakage)"},
    {id:"tunnel",label:"อุโมงค์ (Tunnel)"},
  ]},
  {title:"เปิดเครื่องและทดสอบ — Start the system",items:[
    {id:"bios",label:"การตั้งค่า BIOS (Bios setting)"},
    {id:"aws",label:"ระบบ AWS (Operator's AWS System Unit)"},
    {id:"control",label:"ชุดควบคุม (Control Unit)"},
    {id:"transformer",label:"หม้อแปลงไฟฟ้า (Transformer)"},
    {id:"emergency",label:"สวิตช์หยุดฉุกเฉิน (Emergency stop switches)"},
    {id:"dc_voltage",label:"แรงดันไฟ DC outputs (DC voltage outputs)"},
    {id:"monitor",label:"จอมอนิเตอร์ (Monitor)"},
  ]},
  {title:"การตรวจสอบพิเศษ — Special Inspection",items:[
    {id:"wire_awg",label:"สายตัวนำมองเห็นอย่างน้อย 50% (Wire visible ≥ 50%)",special:"AWG"},
    {id:"penetration",label:"ทดสอบความสามารถในการทะลุผ่าน (Penetration ability)",special:"mm"},
    {id:"radiation",label:"ตรวจวัดการรั่วไหลรังสี (Radiation leakage survey)"},
    {id:"dist_panel",label:"แผงจ่ายไฟ (Distribution Panel)"},
  ]},
];

const statusMap={};
const specialVals={};

function renderChecklist(){
  const area=document.getElementById('checklistArea');
  area.innerHTML='';
  sections.forEach(sec=>{
    const wrap=document.createElement('div');
    wrap.style.marginBottom='14px';
    const hdr=document.createElement('div');
    hdr.className='section-title';
    hdr.textContent=sec.title;
    wrap.appendChild(hdr);
    sec.items.forEach(item=>{
      if(!(item.id in statusMap))statusMap[item.id]=null;
      if(item.special&&!(item.id in specialVals))specialVals[item.id]='';
      const v=statusMap[item.id];
      const row=document.createElement('div');
      row.className=(item.special?'special-row':'check-row')+(v?' st-'+v:'');
      if(item.special){
        const top=document.createElement('div');
        top.className='special-top';
        const lbl=document.createElement('span');
        lbl.className='check-label';
        lbl.textContent=item.label;
        top.appendChild(lbl);
        const inp=document.createElement('input');
        inp.type='number';
        inp.className='val-input';
        inp.placeholder='ค่า';
        inp.value=specialVals[item.id]||'';
        inp.oninput=e=>{specialVals[item.id]=e.target.value};
        top.appendChild(inp);
        const ul=document.createElement('span');
        ul.className='unit-label';
        ul.textContent=item.special;
        top.appendChild(ul);
        const btns=document.createElement('div');
        btns.className='btns';
        ['ok','warn','crit'].forEach(s=>{
          const btn=document.createElement('button');
          btn.className='sbtn'+(v===s?' '+s:'');
          btn.textContent=s==='ok'?'✓':s==='warn'?'!':'✕';
          btn.setAttribute('aria-label',s==='ok'?'ปกติ':s==='warn'?'ควรติดตาม':'ต้องแก้ไข');
          btn.onclick=()=>{statusMap[item.id]=statusMap[item.id]===s?null:s;renderChecklist();updateProgress()};
          btns.appendChild(btn);
        });
        top.appendChild(btns);
        row.appendChild(top);
      } else {
        const lbl=document.createElement('span');
        lbl.className='check-label';
        lbl.textContent=item.label;
        row.appendChild(lbl);
        const btns=document.createElement('div');
        btns.className='btns';
        ['ok','warn','crit'].forEach(s=>{
          const btn=document.createElement('button');
          btn.className='sbtn'+(v===s?' '+s:'');
          btn.textContent=s==='ok'?'✓':s==='warn'?'!':'✕';
          btn.setAttribute('aria-label',s==='ok'?'ปกติ':s==='warn'?'ควรติดตาม':'ต้องแก้ไข');
          btn.onclick=()=>{statusMap[item.id]=statusMap[item.id]===s?null:s;renderChecklist();updateProgress()};
          btns.appendChild(btn);
        });
        row.appendChild(btns);
      }
      wrap.appendChild(row);
    });
    area.appendChild(wrap);
  });
}

function updateProgress(){
  let ok=0,warn=0,crit=0,total=0,done=0;
  sections.forEach(sec=>sec.items.forEach(item=>{
    total++;
    const v=statusMap[item.id];
    if(v==='ok'){ok++;done++;}
    else if(v==='warn'){warn++;done++;}
    else if(v==='crit'){crit++;done++;}
  }));
  document.getElementById('cntOk').textContent=ok;
  document.getElementById('cntWarn').textContent=warn;
  document.getElementById('cntCrit').textContent=crit;
  document.getElementById('pctTxt').textContent=done+' / '+total+' รายการ';
  document.getElementById('progFill').style.width=Math.round(done/total*100)+'%';
}

function setupSig(id){
  const canvas=document.getElementById(id);
  const ctx=canvas.getContext('2d');
  ctx.strokeStyle='#1a1a1a';
  ctx.lineWidth=2;
  ctx.lineCap='round';
  ctx.lineJoin='round';
  let drawing=false,lastX=0,lastY=0;
  function pos(e){
    const r=canvas.getBoundingClientRect();
    const scaleX=canvas.width/r.width,scaleY=canvas.height/r.height;
    if(e.touches)return{x:(e.touches[0].clientX-r.left)*scaleX,y:(e.touches[0].clientY-r.top)*scaleY};
    return{x:(e.clientX-r.left)*scaleX,y:(e.clientY-r.top)*scaleY};
  }
  canvas.addEventListener('mousedown',e=>{drawing=true;const p=pos(e);lastX=p.x;lastY=p.y});
  canvas.addEventListener('mousemove',e=>{if(!drawing)return;const p=pos(e);ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(p.x,p.y);ctx.stroke();lastX=p.x;lastY=p.y});
  canvas.addEventListener('mouseup',()=>drawing=false);
  canvas.addEventListener('touchstart',e=>{e.preventDefault();drawing=true;const p=pos(e);lastX=p.x;lastY=p.y},{passive:false});
  canvas.addEventListener('touchmove',e=>{e.preventDefault();if(!drawing)return;const p=pos(e);ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(p.x,p.y);ctx.stroke();lastX=p.x;lastY=p.y},{passive:false});
  canvas.addEventListener('touchend',()=>drawing=false);
}

function clearSig(id){
  const c=document.getElementById(id);
  c.getContext('2d').clearRect(0,0,c.width,c.height);
}

function setCanvasSize(){
  ['sigEng','sigUser'].forEach(id=>{
    const c=document.getElementById(id);
    const w=c.offsetWidth;
    c.width=w*window.devicePixelRatio||w*2;
    c.height=100*window.devicePixelRatio||200;
    const ctx=c.getContext('2d');
    ctx.strokeStyle='#1a1a1a';
    ctx.lineWidth=2;
    ctx.lineCap='round';
    ctx.lineJoin='round';
  });
}

function exportPDF(){
  const{jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const W=210,M=14;
  let y=14;
  doc.setFont('helvetica','bold');
  doc.setFontSize(15);
  doc.text('APPLE SCIENTIFIC CO.,LTD.',W/2,y,{align:'center'});
  y+=6;
  doc.setFont('helvetica','normal');
  doc.setFontSize(8);
  doc.setTextColor(100,100,100);
  doc.text('538/23 Latphrao Road, Chankasem, Chatuchak, Bangkok 10900 | Tel: (662)513-7588 | info@applescientific.com',W/2,y,{align:'center'});
  y+=1;
  doc.setDrawColor(200,200,200);
  doc.setLineWidth(0.4);
  doc.line(M,y+2,W-M,y+2);
  y+=7;
  doc.setFont('helvetica','bold');
  doc.setFontSize(14);
  doc.setTextColor(0,0,0);
  doc.text('Detail of Check',W/2,y,{align:'center'});
  y+=7;
  doc.setFont('helvetica','normal');
  doc.setFontSize(9.5);
  const sn=document.getElementById('sn').value||'___________';
  const dt=document.getElementById('date').value||'___________';
  const loc=document.getElementById('location').value||'___________';
  doc.text('Product: Conveyor X-ray     Brand: LINEV     Model: BV100100DV     S/N: '+sn,M,y);
  y+=6;
  doc.text('Date: '+dt+'     Location: '+loc,M,y);
  y+=9;
  const slabels={ok:'OK',warn:'WARN',crit:'ATTN'};
  const scol={ok:[59,109,17],warn:[186,117,23],crit:[163,45,45]};
  const sbg={ok:[234,243,222],warn:[250,238,218],crit:[252,235,235]};
  sections.forEach(sec=>{
    if(y>268){doc.addPage();y=14}
    doc.setFillColor(30,30,30);
    doc.rect(M,y-4,W-M*2,7,'F');
    doc.setTextColor(255,255,255);
    doc.setFont('helvetica','bold');
    doc.setFontSize(8.5);
    doc.text(sec.title,M+3,y);
    doc.setTextColor(0,0,0);
    y+=6;
    sec.items.forEach(item=>{
      if(y>276){doc.addPage();y=14}
      const v=statusMap[item.id];
      if(v){
        doc.setFillColor(...sbg[v]);
        doc.rect(M,y-3.5,W-M*2,6.5,'F');
      } else {
        doc.setFillColor(250,250,248);
        doc.rect(M,y-3.5,W-M*2,6.5,'F');
      }
      doc.setDrawColor(210,210,210);
      doc.setLineWidth(0.2);
      doc.rect(M,y-3.5,W-M*2,6.5,'S');
      doc.setFont('helvetica','normal');
      doc.setFontSize(8.5);
      doc.setTextColor(40,40,40);
      let lbl=item.label;
      if(item.special&&specialVals[item.id])lbl+='  ['+specialVals[item.id]+' '+item.special+']';
      doc.text(lbl,M+2.5,y,{maxWidth:W-M*2-20});
      if(v){
        doc.setFillColor(...scol[v]);
        doc.roundedRect(W-M-13,y-3,11,5,1.5,1.5,'F');
        doc.setTextColor(255,255,255);
        doc.setFont('helvetica','bold');
        doc.setFontSize(7);
        doc.text(slabels[v],W-M-7.5,y,{align:'center'});
        doc.setTextColor(0,0,0);
      }
      y+=8;
    });
    y+=3;
  });
  const comments=document.getElementById('comments').value.trim();
  if(comments){
    if(y>260){doc.addPage();y=14}
    doc.setFillColor(30,30,30);
    doc.rect(M,y-4,W-M*2,7,'F');
    doc.setTextColor(255,255,255);
    doc.setFont('helvetica','bold');
    doc.setFontSize(8.5);
    doc.text('Comments / ความคิดเห็น',M+3,y);
    doc.setTextColor(0,0,0);
    y+=7;
    doc.setFont('helvetica','normal');
    doc.setFontSize(9);
    const lines=doc.splitTextToSize(comments,W-M*2-4);
    doc.text(lines,M+3,y);
    y+=lines.length*5.5+6;
  }
  if(y>246){doc.addPage();y=14}
  doc.setFillColor(30,30,30);
  doc.rect(M,y-4,W-M*2,7,'F');
  doc.setTextColor(255,255,255);
  doc.setFont('helvetica','bold');
  doc.setFontSize(8.5);
  doc.text('Signature / ลายเซ็น',M+3,y);
  doc.setTextColor(0,0,0);
  y+=6;
  const hw=(W-M*2)/2-5;
  doc.setFontSize(8);
  doc.setTextColor(80,80,80);
